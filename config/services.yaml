# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Consumer name for the Redis Streams transport when HOSTNAME is unset
    messenger_consumer_fallback: 'linkboard-worker'
    # Prefix of the click-counter keys `link:{id}:clicks` (FR-RED-3); '' in dev/prod,
    # `test:` in the test environment so the suite can clean its keys on a shared Redis
    app.click_counter_key_prefix: ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/*/Entity/'
            - '../src/*/Dto/'
            - '../src/*/Message/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Domain repositories are interfaces; the Doctrine implementation is the binding.
    App\Auth\UserRepositoryInterface: '@App\Auth\Repository\DoctrineUserRepository'
    App\Auth\ApiKeyRepositoryInterface: '@App\Auth\Repository\DoctrineApiKeyRepository'
    App\Link\LinkRepositoryInterface: '@App\Link\Repository\DoctrineLinkRepository'
    App\Link\SlugGeneratorInterface: '@App\Link\SlugGenerator'
    # The click write path: counter + message (add-async-click-logging); the
    # redirect performs no SQL write.
    App\Click\ClickRecorderInterface: '@App\Click\Recorder\MessengerClickRecorder'
    # Country resolution: the chain selects tagged resolvers by COUNTRY_RESOLVERS
    # (design decision 8); the chain itself is a startup check.
    App\Redirect\Geo\CountryResolverInterface: '@App\Redirect\Geo\ChainCountryResolver'

    # Run from App\Kernel::boot() on every boot, hence public: constructs the
    # tagged app.startup_check services so a misconfiguration fails before
    # anything is served.
    App\Shared\Boot\StartupChecks:
        public: true

when@test:
    parameters:
        app.click_counter_key_prefix: 'test:'
    services:
        # Rate-limiter storage for the test environment: lives for the process,
        # is not tagged kernel.reset, so a test that sends 11 requests through
        # one kernel (disableReboot) sees one window. Not registered elsewhere.
        app.rate_limiter.test_storage:
            class: Symfony\Component\RateLimiter\Storage\InMemoryStorage
        # The framework's in-memory transport factory, minus its kernel.reset tag:
        # reset between the requests of one test client, it would empty the
        # transports it created, and a test that redirects several times through
        # one kernel must keep every message until it consumes them (in
        # production the Redis stream outlives the request). Tests reset the
        # transports themselves in tearDown.
        messenger.transport.in_memory.factory:
            class: Symfony\Component\Messenger\Transport\InMemory\InMemoryTransportFactory
            arguments: ['@clock']
            tags: ['messenger.transport_factory']
        # Records every SQL string of a request so a test can assert that the
        # redirect performs no database write (design decision 8)
        App\Tests\Fixture\StatementRecorder:
            tags: ['doctrine.middleware']
        # Throws on an armed SQL needle so a test can fail a multi-statement
        # transaction at a chosen point (the demo seed's rollback guarantee)
        App\Tests\Fixture\FailingStatement:
            tags: ['doctrine.middleware']
        # Fixed IP→country map for the test suite (COUNTRY_RESOLVERS=fixed)
        App\Tests\Fixture\FixedMapCountryResolver:
            tags:
                - { name: app.country_resolver, key: fixed }
