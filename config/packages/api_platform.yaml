# API Platform 4.3 — see `bin/console config:dump-reference api_platform`.
# Behavior fixed by the specification (§4, delta specs api-docs and
# api-error-format): operations under /api/v1, docs at /api/docs and
# /api/docs.json, JSON only, RFC 9457 problem details for every error.
api_platform:
    title: Linkboard API
    version: 1.0.0
    description: Short links with smart routing and click analytics.
    show_webby: false

    # Operations get the /v1 segment; the route prefix /api itself comes from
    # config/routes/api_platform.yaml, so documentation stays at /api/docs.
    defaults:
        route_prefix: /v1
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

    # JSON only: no JSON-LD/Hydra, HAL or JSON:API surfaces.
    formats:
        json: ['application/json']
    patch_formats:
        json: ['application/merge-patch+json']
    # html first: a bare GET /api/docs (no Accept header) gets Swagger UI;
    # /api/docs.json and Accept: application/json get the OpenAPI document.
    docs_formats:
        html: ['text/html']
        json: ['application/json']
        jsonopenapi: ['application/vnd.openapi+json']
    error_formats:
        jsonproblem: ['application/problem+json']

    # Errors raised by Symfony itself under /api (unknown route, wrong
    # method) are rendered as problem details too.
    handle_symfony_errors: true

    enable_swagger_ui: true
    # Declares the bearer scheme to API Platform itself so every operation
    # carries a `security` requirement; Swagger UI attaches the token from
    # "Authorize" only to operations that declare one. The name matches the
    # scheme LexikJWTAuthenticationBundle registers, so the two merge.
    swagger:
        http_auth:
            JWT:
                scheme: bearer
                bearerFormat: JWT
    enable_re_doc: false
    enable_scalar: false
    enable_docs: true
    # The Hydra/JSON-LD entrypoint document cannot be expressed in plain JSON;
    # the versioned base path /api/v1 serves the documentation instead
    # (config/routes.yaml).
    enable_entrypoint: false

    # Not part of the specification; off to keep the surface minimal.
    mcp:
        enabled: false
    # A read-only GraphQL surface over links, the nine reports and `me`
    # (change stretch-graphql). Every resource declares its operations — the
    # excluded three with an empty list — because a resource that declares
    # none receives the default set, mutations included.
    graphql:
        enabled: true
        # The schema is published like the OpenAPI document is: a client that
        # cannot discover it is worse off than one that can.
        introspection:
            enabled: true
        # A development IDE mounted in production is a surface with no owner.
        graphiql:
            enabled: false
        graphql_playground:
            enabled: false
        # Lowered from the framework's 20 and 500, chosen against what this
        # schema can usefully express rather than against the default: the
        # deepest legitimate query — a link's collection with a report — is far
        # under ten.
        max_query_depth: 10
        max_query_complexity: 200

    # Uniform error type URIs; validation errors get their own resource
    # class when the first validated input arrives (add-link-crud).
    openapi:
        contact:
            name: Linkboard
        license:
            name: proprietary
