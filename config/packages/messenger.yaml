framework:
    messenger:
        # Messages that exhaust their retries land here for inspection:
        # bin/console messenger:failed:show / messenger:failed:retry
        failure_transport: failed

        transports:
            # Redis Streams (specification FR-CLK-1). One consumer group; each
            # worker names itself by hostname so several can share the stream.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: messages
                    group: linkboard
                    consumer: '%env(default:messenger_consumer_fallback:HOSTNAME)%'
                retry_strategy:
                    # FR-CLK-5: 3 attempts, exactly 1 s, 2 s, 4 s — jitter 0
                    # (the framework's 0.1 default would randomise the backoff)
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
                    jitter: 0
            # Parked messages; the table comes from a reviewed migration, never
            # from runtime DDL (messenger_messages)
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    auto_setup: false

        routing:
            # One accepted redirect → one message on the Redis stream (FR-CLK-1)
            App\Click\Message\ClickRecorded: async

when@test:
    framework:
        messenger:
            transports:
                async:
                    dsn: 'in-memory://'
                    retry_strategy:
                        # the same shape as production, milliseconds instead of
                        # seconds so the Worker lifecycle test runs in a blink
                        max_retries: 3
                        delay: 10
                        multiplier: 2
                        max_delay: 0
                        jitter: 0
                failed: 'in-memory://'
