twig:
    file_name_pattern: '*.twig'
    # The project's form theme: Pico styles the native elements, so this only
    # adds the [role=alert] errors the web tests select on and aria-invalid
    # (change add-web-ui, design decision 8).
    form_themes: ['form/pico_layout.html.twig']
    globals:
        # The same switch `App\Auth\Registration\ClosedRegistration` enforces,
        # so the pages cannot offer a form the listener answers 404 for
        # (change stretch-public-hosting, design decision 5). One source, two
        # readers — the rule is not restated, it is read twice.
        registration_enabled: '%env(bool:REGISTRATION_ENABLED)%'
        # A demo instance publishes its own credentials, which is the only
        # place they are stated: the repository says the page states them, and
        # never what they are (change stretch-public-hosting, design decision
        # 7). Off everywhere else, and then the sign-in page says nothing.
        demo_instance: '%env(bool:DEMO_INSTANCE)%'
        demo_email: '%app.demo_email%'
        demo_password: '%env(DEMO_PASSWORD)%'

when@test:
    twig:
        strict_variables: true
