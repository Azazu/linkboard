security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # One identity for both firewalls; the provider looks users up through the
    # repository so the match is case-insensitive like the database index.
    providers:
        app_users:
            id: App\Auth\Security\UserProvider

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # API: stateless, bearer JWT (FR-AUTH-3). Tokens are issued by
        # json_login on /api/v1/auth/token through Lexik's handlers.
        # `(/|$)`: a slug such as /api-promo must stay public (spec redirect)
        api:
            pattern: ^/api(/|$)
            stateless: true
            provider: app_users
            user_checker: App\Auth\Security\BlockedUserChecker
            json_login:
                check_path: /api/v1/auth/token
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            entry_point: jwt

        # Web: session form login (FR-AUTH-2), CSRF on, no remember-me.
        main:
            lazy: true
            provider: app_users
            user_checker: App\Auth\Security\BlockedUserChecker
            form_login:
                login_path: /login
                check_path: /login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: /
            logout:
                path: /logout
                target: /login

    # Only the first matching rule is applied.
    access_control:
        - { path: ^/api/v1/auth/, roles: PUBLIC_ACCESS }
        # test-only route (config/routes.yaml, when@test) that throws on purpose so the
        # 500 problem-details shape can be asserted; no such route exists outside test
        - { path: ^/api/v1/_test/, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin/, roles: ROLE_ADMIN }
        - { path: ^/api/, roles: ROLE_USER }
        - { path: ^/(login|register)$, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
