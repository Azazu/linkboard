# Linkboard — nginx in front of php-fpm (local development).
# Docroot is Symfony's public/; it does not exist before the application
# scaffold (change 2), so the server answers 404 until then.
server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 8m;
    server_tokens off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # The front controller is the only executable PHP file.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Prevents URIs that include the front controller from being exposed
        internal;
    }

    # Any other .php request is refused.
    location ~ \.php$ {
        return 404;
    }

    access_log /dev/stdout;
    error_log /dev/stderr notice;
}
