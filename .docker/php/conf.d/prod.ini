; Linkboard — production PHP settings (prod stage only; loaded after app.ini).
; The image is immutable, so the opcode cache never needs to look at the clock.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 30000
opcache.interned_strings_buffer = 16

; The redirect path is I/O bound — one indexed query and a Redis dispatch — so
; JIT would buy nothing and costs memory.
opcache.jit = off
opcache.jit_buffer_size = 0

; Nothing about the runtime reaches a response.
display_errors = Off
display_startup_errors = Off
expose_php = Off
