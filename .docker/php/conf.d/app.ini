; Linkboard — local development PHP settings (dev image only)
date.timezone = UTC
memory_limit = 512M
upload_max_filesize = 8M
post_max_size = 8M
expose_php = Off

; Errors: loud in the container log, never in the response body
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; OPcache: on, with timestamp validation so edits are picked up
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; Realpath cache helps Symfony's autoloader
realpath_cache_size = 4096K
realpath_cache_ttl = 600
